server.port=8080
spring.application.name=human-scratch-three

# PostgreSQL (variables opcionales; valores por defecto para desarrollo local)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:manos_unidas}
spring.datasource.username=${DB_USER:manos}
spring.datasource.password=${DB_PASSWORD:manos}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
